<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGP Looking Glass - Russellville EPB SmartNet</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-card: rgba(17, 34, 64, 0.65);
            --text-light: #e6f1ff;
            --text-muted: #94a3b8;
            --accent-blue: #00a8ff;
            --border-color: rgba(255, 255, 255, 0.12);
        }

        *, *:before, *:after { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }

        /* FULLPAGE BACKGROUND WITH 25% OPACITY */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('images/background_image.jpg') center/cover no-repeat;
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        /* IP & ASN HEADER BAR */
        .user-info-bar {
            width: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
        }

        .info-badge {
            background: rgba(0, 168, 255, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .info-badge span {
            font-weight: bold;
            color: var(--accent-blue);
        }

        /* HEADER SECTION */
        header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .logo {
            max-width: 550px;
            width: 90%;
            height: auto;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 15px rgba(0, 168, 255, 0.3));
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* GLASSMORPHISM CARD FOR BGP LOOKING GLASS */
        main {
            width: 90%;
            max-width: 900px;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--accent-blue);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
        }

        /* BGP.TOOLS INJECTED LAYOUT OVERRIDES */
        #bgp-page {
            display: grid;
            gap: 0.75rem 1rem;
            grid-template-columns: minmax(12rem, 1fr) minmax(16rem, 1.8fr) auto;
            align-items: end;
        }

        #bgp-page > hr, #bgp-page > noscript, #scrollwrapper {
            grid-column: 1 / -1;
        }

        #bgp-page p, #bgp-page label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        #SessionDropDownText { grid-column: 1; grid-row: 1; }
        #bgpsessionSelect   { grid-column: 1; grid-row: 2; }
        #bgp-page > p:not(#SessionDropDownText, #divider) { grid-column: 2; grid-row: 1; }
        #prefix             { grid-column: 2; grid-row: 2; }
        #divider { display: none; }
        #bgp-submit-button { grid-column: 3; grid-row: 2; }

        #bgp-page select, #bgp-page input[type="text"] {
            background: rgba(10, 25, 47, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-light);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }

        #bgp-submit-button {
            background-color: var(--accent-blue);
            border: none;
            border-radius: 6px;
            color: #000000;
            font-weight: 800;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            min-height: 2.75rem;
        }

        #scrollwrapper {
            background: rgba(5, 12, 24, 0.85);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 1.25rem;
            min-height: 10rem;
            margin-top: 1rem;
        }

        #bgpResults {
            color: #E2E8F0;
            font-family: monospace !important;
            font-size: 0.9rem !important;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="user-info-bar">
        <div class="info-badge">Your IP: <span id="user-ip">Loading...</span></div>
        <div class="info-badge">ASN / Org: <span id="user-asn">Loading...</span></div>
    </div>

    <header>
       <img src="logo.png" alt="Company Logo" width="180" height="50" loading="eager">
        <h1>BGP Looking Glass</h1>
    </header>

    <main>
        ::BGPTOOLS_LOOKINGGLASS_BOX::
    </main>

    <footer>
        © 2026 EPB SmartNet | Russellville KY 42276 | AS14749
    </footer>

    <script>
        async function fetchNetworkDetails() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                document.getElementById('user-ip').textContent = data.ip || 'N/A';
                document.getElementById('user-asn').textContent = `${data.asn || ''} (${data.org || 'Unknown'})`;
            } catch (error) {
                document.getElementById('user-ip').textContent = 'Unable to fetch';
                document.getElementById('user-asn').textContent = 'Unable to fetch';
            }
        }
        fetchNetworkDetails();
    </script>

</body>
</html>
