<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPB SmartNet - BGP Looking Glass</title>
    <style>
        :root {
            --epb-primary-dark: #1C4E6E;   /* Dark Blue */
            --epb-secondary-blue: #608299; /* Medium Blue */
            --epb-light-gray: #D4D6D7;     /* Light Gray */
            --bg-neutral: #0F172A;          /* Modern Dark Background */
            --surface: rgba(30, 41, 59, 0.65); /* Translucent Card Surface for Glassmorphism */
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.12);
            --accent: #38BDF8;             /* Accent Light Blue */
        }

        *, *:before, *:after { box-sizing: border-box; }

        body {
            background-color: var(--bg-neutral);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* FULLPAGE BACKGROUND IMAGE WITH 25% OPACITY */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('images/background_image.jpg') center/cover no-repeat;
            opacity: 0.25;
            z-index: -1;
            pointer-events: none;
        }

        /* HEADER */
        .site-header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--epb-primary-dark);
            padding: 1rem 2rem;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .header-logo {
            height: 52px; /* Increased logo size */
            width: auto;
            object-fit: contain;
        }

        .header-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 0;
        }

        /* PAGE SHELL */
        .page-shell {
            flex: 1 0 auto;
            width: min(1100px, calc(100% - 2rem));
            margin: 3rem auto;
            text-align: center;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin: 0.5rem 0;
            color: var(--text-main);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .intro {
            color: var(--text-muted);
            font-size: 1.05rem;
            margin: 0 auto 2rem;
            max-width: 600px;
        }

        /* GLASSMORPHISM CARD CONTAINER FOR LOOKING GLASS */
        .looking-glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-top: 5px solid var(--epb-primary-dark);
            border-radius: 0.75rem;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            text-align: left;
        }

        /* BGP.TOOLS INJECTED FORM OVERRIDES */
        #bgp-page {
            display: grid;
            gap: 0.75rem 1rem;
            grid-template-columns: minmax(12rem, 1fr) minmax(16rem, 1.8fr) auto;
            align-items: end;
        }

        #bgp-page > hr, 
        #bgp-page > noscript, 
        #scrollwrapper {
            grid-column: 1 / -1;
        }

        #bgp-page p, 
        #bgp-page label {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        #SessionDropDownText { grid-column: 1; grid-row: 1; }
        #bgpsessionSelect   { grid-column: 1; grid-row: 2; }
        
        #bgp-page > p:not(#SessionDropDownText, #divider) { grid-column: 2; grid-row: 1; }
        #prefix             { grid-column: 2; grid-row: 2; }
        
        #divider { display: none; }
        #bgp-submit-button { grid-column: 3; grid-row: 2; }

        /* FORM INPUT STYLES WITH GLASS TOUCH */
        #bgp-page select, 
        #bgp-page input[type="text"] {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text-main);
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
        }

        #bgp-page select:focus, 
        #bgp-page input[type="text"]:focus {
            border-color: var(--accent);
            background: rgba(15, 23, 42, 0.9);
        }

        /* QUERY BUTTON STYLE */
        #bgp-submit-button {
            background-color: var(--epb-primary-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: #FFFFFF;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            min-height: 2.75rem;
            transition: background-color 0.2s, transform 0.1s;
        }

        #bgp-submit-button:hover {
            background-color: var(--epb-secondary-blue);
        }

        /* RESULTS TERMINAL BOX WITH GLASSMORPHISM */
        #scrollwrapper {
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.25rem;
            min-height: 10rem;
            margin-top: 1rem;
        }

        #bgpResults {
            color: #E2E8F0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
            font-size: 0.9rem !important;
            line-height: 1.5;
        }

        /* FOOTER */
        .site-footer {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
        }

        @media (max-width: 768px) {
            #bgp-page {
                display: flex;
                flex-direction: column;
                align-items: stretch;
            }
            #bgp-submit-button { margin-top: 0.5rem; }
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <div class="header-brand">
                <img src="images/logo.png" alt="EPB SmartNet Logo" class="header-logo">
                <h1 class="header-title">EPB SmartNet</h1>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <h1 class="hero-title">BGP Looking Glass</h1>
        <p class="intro">
            Inspect real-time BGP routing statistics and prefix availability across the EPB network backbone.
        </p>

        <section class="looking-glass-card">
            <!-- BGP.TOOLS RUNTIME PLACEHOLDER -->
            ::BGPTOOLS_LOOKINGGLASS_BOX::
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 EPB SmartNet | Russellville KY 42276 | AS14749</p>
    </footer>

</body>
</html>
