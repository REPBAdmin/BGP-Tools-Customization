<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGP Looking Glass - Russellville EPB SmartNet</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --bg-card: #112240;
            --text-light: #e6f1ff;
            --accent-blue: #00a8ff;
            --border-color: #233554;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Info Bar for User IP & ASN */
        .user-info-bar {
            width: 100%;
            background-color: rgba(17, 34, 64, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.95rem;
        }

        .info-badge {
            background: rgba(0, 168, 255, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .info-badge span {
            font-weight: bold;
            color: var(--accent-blue);
        }

        /* Header Section */
        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .logo {
            max-width: 600px;
            width: 90%;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 168, 255, 0.2));
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
        }

        /* Main Content Box (Looking Glass Form Area) */
        main {
            width: 90%;
            max-width: 800px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

    <!-- IP & ASN Header -->
    <div class="user-info-bar">
        <div class="info-badge">Your IP: <span id="user-ip">Loading...</span></div>
        <div class="info-badge">ASN / Org: <span id="user-asn">Loading...</span></div>
    </div>

    <!-- Center Logo & Title Header -->
    <header>
        <img src="logo.png" alt="Russellville EPB SmartNet Logo" class="logo">
        <h1>BGP Looking Glass</h1>
    </header>

    <!-- Main Looking Glass Interface -->
    <main>
        <!-- Place your Looking Glass form controls (Query type, Target IP/Host, Router select) here -->
    </main>

    <script>
        // Fetch IP and ASN via RDAP/ARIN-compliant API endpoint
        async function fetchNetworkDetails() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                
                document.getElementById('user-ip').textContent = data.ip || 'N/A';
                document.getElementById('user-asn').textContent = `${data.asn || ''} (${data.org || 'Unknown'})`;
            } catch (error) {
                document.getElementById('user-ip').textContent = 'Unable to fetch';
                document.getElementById('user-asn').textContent = 'Unable to fetch';
            }
        }

        fetchNetworkDetails();
    </script>
</body>
</html>
